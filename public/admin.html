<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ders Ekle · Açık Mühendislik Yönetim</title>
<style>
  :root { --ana: #0f6e56; --hata: #b3261e; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f5; color: #222; }
  header { background: var(--ana); color: #fff; padding: 0.9rem 1.5rem; font-weight: 700; }
  header a { color: #fff; }
  main { max-width: 760px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
  .kart { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 1.2rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin: 0.8rem 0 0.25rem; }
  label small { font-weight: 400; color: #666; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 0.55rem 0.65rem; border: 1px solid #bbb; border-radius: 6px; font-size: 1rem; }
  textarea { min-height: 140px; font-family: inherit; }
  .satir { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  button { background: var(--ana); color: #fff; border: 0; border-radius: 8px; padding: 0.7rem 1.4rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .hata { color: var(--hata); font-size: 0.9rem; min-height: 1.2em; }
  #sonuc { white-space: pre-wrap; background: #0b3b2f; color: #d8efe7; border-radius: 8px; padding: 1rem; font-size: 0.9rem; display: none; }
  #sonuc a { color: #8fe3c3; }
  pre#onizleme { background: #f0f0f0; border-radius: 8px; padding: 0.8rem; font-size: 0.8rem; overflow: auto; max-height: 260px; }
</style>
</head>
<body>
<header>🛠 Açık Mühendislik · Ders Ekleme Paneli &nbsp; <a href="/">← siteye dön</a></header>
<main>
  <div class="kart">
    <label>GitHub token <small>(sadece bu tarayıcıda saklanır, kimseye gönderilmez. Settings → Developer settings → Personal access tokens → Tokens (classic) → <b>repo</b> yetkili)</small></label>
    <input type="password" id="token" placeholder="ghp_..." autocomplete="off" />
    <div class="hata" id="tokenHata"></div>
  </div>

  <div class="kart">
    <div class="satir">
      <div>
        <label>Ders başlığı</label>
        <input id="title" placeholder="Örn. PrePoMax ile Temas Analizi" />
      </div>
      <div>
        <label>Dosya adı (slug) <small>otomatik dolar, değiştirebilirsin</small></label>
        <input id="slug" placeholder="prepomax-temas-analizi" />
      </div>
    </div>
    <div class="satir">
      <div>
        <label>Kurs klasörü</label>
        <select id="kurs">
          <option value="fem/prepomax">FEM → PrePoMax</option>
          <option value="fem/freecad-fem">FEM → FreeCAD FEM</option>
          <option value="fem/freecad-burkulma">FEM → FreeCAD Burkulma</option>
          <option value="fem/calculix-fem">FEM → CalculiX FEM</option>
          <option value="fem/salome-meca">FEM → Salome-Meca</option>
          <option value="fem/fembygen">FEM → Yapısal Optimizasyon (FEMbyGEN)</option>
          <option value="fem/openradioss">FEM → OpenRadioss</option>
          <option value="cfd/freecad-cfd">CFD → FreeCAD CFD (CfdOF)</option>
          <option value="cfd/helyxos-cfd">CFD → HelyxOS CFD</option>
          <option value="cfd/openfoam-temel">CFD → OpenFOAM (Temel)</option>
          <option value="acik-donanim">Açık Donanım</option>
          <option value="freecad-makro">FreeCAD Makro</option>
          <option value="__yeni__">＋ Yeni kurs klasörü aç…</option>
        </select>
        <div id="yeniKursKutu" style="display:none; margin-top:0.5rem;">
          <input id="yeniKurs" placeholder="Örn. fem/yeni-kurs (küçük harf, tireli)" />
          <small style="color:#666;">Yeni klasör menüye otomatik eklenmez; ilk dersten sonra site yöneticisine söyleyin, menüye eklesin.</small>
        </div>
      </div>
      <div>
        <label>Kurs içindeki sıra no</label>
        <input id="order" type="number" min="1" value="1" />
      </div>
    </div>
    <div class="satir">
      <div>
        <label>YouTube video ID <small>linkteki v= sonrası 11 karakter</small></label>
        <input id="youtube" placeholder="5s2o0gQy4kY" maxlength="11" />
        <div class="hata" id="ytHata"></div>
      </div>
      <div>
        <label>Yayın tarihi</label>
        <input id="tarih" type="date" />
      </div>
    </div>
    <label>Hazırlayan (eğitmen) <small>havuzdan seç veya yenisi ekle</small></label>
    <select id="yazarSec">
      <option value="">— seçin —</option>
      <option value="0">Pakrad Amini</option>
      <option value="1">Mouhammad Almoukaddam</option>
      <option value="2">Volkan Bayrak</option>
      <option value="3">Nedir Ymamov</option>
      <option value="4">Erencan Kahveci</option>
      <option value="5">Can Karaca Kantarcı</option>
      <option value="6">Serdar Turgut İnce</option>
      <option value="7">Ahmet Özkan Canlı</option>
      <option value="8">Efsun Sultan Bulut</option>
      <option value="9">Fatih Yegül</option>
      <option value="10">İbrahim Halil Bedük</option>
      <option value="11">Batuhan Tangut</option>
      <option value="12">İbrahim Furkan Ercanlı</option>
      <option value="13">Hüseyin Kürşad Namlı</option>
      <option value="14">Sarp Gürenli</option>
      <option value="15">Asena Çataloluk</option>
      <option value="16">Bahar Ebru Ezer</option>
      <option value="17">Kenan Aslan</option>
      <option value="18">Uğur Can</option>
      <option value="19">Nuri Taytan</option>
      <option value="20">Ahmet Emre Yüksel</option>
      <option value="21">Berat Yağmur</option>
      <option value="22">Hamza Gerekan</option>
      <option value="23">Fatma Özdağlı</option>
      <option value="24">Muhammet Furkan Sarı</option>
      <option value="25">Enes Durukan</option>
      <option value="__yeni__">＋ Yeni eğitmen ekle…</option>
    </select>
    <div id="yeniYazarKutu" style="display:none; margin-top:0.5rem;">
      <div class="satir">
        <div>
          <label>Yeni eğitmenin adı soyadı</label>
          <input id="yazarAd" placeholder="Ad Soyad" />
        </div>
        <div>
          <label>YouTube kanalı</label>
          <input id="yazarKanalYeni" placeholder="https://www.youtube.com/@..." />
        </div>
      </div>
      <label>Eğitmen fotoğrafı <small>(otomatik yuvarlak kırpılır; boş bırakırsan baş harf görünür)</small></label>
      <input id="yazarFoto" type="file" accept="image/*" />
    </div>
    <label>Yazılım <small>kursa göre otomatik dolar; yeni yazılım yazılabilir</small></label>
    <input id="yazilim" list="yazilimListe" placeholder="Örn. PrePoMax" />
    <datalist id="yazilimListe">
      <option value="PrePoMax"></option><option value="FreeCAD FEM"></option><option value="FreeCAD FEMbyGEN"></option>
      <option value="FreeCAD CfdOF"></option><option value="FreeCAD Makro"></option><option value="CalculiX"></option>
      <option value="Salome-Meca"></option><option value="OpenFOAM"></option><option value="HELYX-OS"></option>
      <option value="OpenRadioss"></option><option value="Açık Donanım"></option>
    </datalist>
    <label>Kısa açıklama <small>(arama motorları için 1 cümle)</small></label>
    <input id="description" placeholder="Örn. İki parça arasında sürtünmeli temas tanımlama." />
    <label>Ders notları <small>(Markdown yazılabilir)</small></label>
    <textarea id="body" placeholder="Bu derste..."></textarea>
  </div>

  <div class="kart">
    <label>Önizleme (oluşacak dosya)</label>
    <pre id="onizleme"></pre>
    <p><button id="kaydet">💾 Kaydet ve Yayınla</button></p>
    <div id="sonuc"></div>
  </div>
</main>

<script>
const REPO = 'Serince/acikmuhendislik.com';
const BRANCH = 'main';
const $ = (id) => document.getElementById(id);
const trMap = { 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u' };

// kayıtlı token varsa doldur
$('token').value = localStorage.getItem('am_token') || '';
$('tarih').valueAsDate = new Date();

function slugify(t) {
  return t.toLowerCase().replace(/[çğıöşü]/g, (c) => trMap[c])
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
}
$('title').addEventListener('input', (e) => {
  if (!$('slug').dataset.elle) $('slug').value = slugify(e.target.value);
});
$('slug').addEventListener('input', (e) => { e.target.dataset.elle = '1'; });

const KURS_YAZILIM = {
  'fem/prepomax': 'PrePoMax', 'fem/freecad-fem': 'FreeCAD FEM', 'fem/freecad-burkulma': 'FreeCAD FEM',
  'fem/calculix-fem': 'CalculiX', 'fem/salome-meca': 'Salome-Meca', 'fem/fembygen': 'FreeCAD FEMbyGEN',
  'fem/openradioss': 'OpenRadioss', 'cfd/freecad-cfd': 'FreeCAD CfdOF', 'cfd/helyxos-cfd': 'HELYX-OS',
  'cfd/openfoam-temel': 'OpenFOAM', 'acik-donanim': 'Açık Donanım', 'freecad-makro': 'FreeCAD Makro'
};
function seciliKurs() {
  const k = $('kurs').value;
  if (k === '__yeni__') return $('yeniKurs').value.trim().toLowerCase().replace(/[^a-z0-9\/\-]+/g, '').replace(/^\/+|\/+$/g, '');
  return k;
}
$('kurs').addEventListener('change', () => {
  const yeni = $('kurs').value === '__yeni__';
  $('yeniKursKutu').style.display = yeni ? 'block' : 'none';
  if (!yeni && !$('yazilim').dataset.elle) $('yazilim').value = KURS_YAZILIM[$('kurs').value] || '';
  guncelleOnizleme();
});
$('yazilim').addEventListener('input', (e) => { e.target.dataset.elle = '1'; });
$('yeniKurs').addEventListener('input', guncelleOnizleme);
$('yazilim').value = KURS_YAZILIM[$('kurs').value];
const HAVUZ = [{"ad": "Pakrad Amini", "kanal": "https://www.youtube.com/@muhendislik1012"}, {"ad": "Mouhammad Almoukaddam", "kanal": "https://www.youtube.com/@acikmuhendislik"}, {"ad": "Volkan Bayrak", "kanal": "https://www.youtube.com/@volkanbayrak8896"}, {"ad": "Nedir Ymamov", "kanal": "https://www.youtube.com/@nedir.y"}, {"ad": "Erencan Kahveci", "kanal": "https://www.youtube.com/@Cankahveci78"}, {"ad": "Can Karaca Kantarcı", "kanal": "https://www.youtube.com/@cankantarc6507"}, {"ad": "Serdar Turgut İnce", "kanal": ""}, {"ad": "Ahmet Özkan Canlı", "kanal": "https://www.youtube.com/@AhmetOzkanCanli"}, {"ad": "Efsun Sultan Bulut", "kanal": "https://www.youtube.com/@efsltn"}, {"ad": "Fatih Yegül", "kanal": "https://www.youtube.com/@FatihYegul-ix1td"}, {"ad": "İbrahim Halil Bedük", "kanal": "https://www.youtube.com/@engineer-e4y"}, {"ad": "Batuhan Tangut", "kanal": "https://www.youtube.com/@Askleipos"}, {"ad": "İbrahim Furkan Ercanlı", "kanal": "https://www.youtube.com/@fercanl2442"}, {"ad": "Hüseyin Kürşad Namlı", "kanal": "https://www.youtube.com/@huseyinkursadnamli1015"}, {"ad": "Sarp Gürenli", "kanal": "https://www.youtube.com/@sarpgurenli3218"}, {"ad": "Asena Çataloluk", "kanal": "https://www.youtube.com/@asenacataloluk2419"}, {"ad": "Bahar Ebru Ezer", "kanal": "https://www.youtube.com/@baharebruezer6894"}, {"ad": "Kenan Aslan", "kanal": "https://www.youtube.com/@kenanaslan1702"}, {"ad": "Uğur Can", "kanal": "https://www.youtube.com/@ugurcan4366"}, {"ad": "Nuri Taytan", "kanal": "https://www.youtube.com/@nuritaytan7838"}, {"ad": "Ahmet Emre Yüksel", "kanal": "https://www.youtube.com/@ahmetemreyuksel3694"}, {"ad": "Berat Yağmur", "kanal": "https://www.youtube.com/@beratyyagmur"}, {"ad": "Hamza Gerekan", "kanal": "https://www.youtube.com/@Hamza-qp9yn"}, {"ad": "Fatma Özdağlı", "kanal": "https://www.youtube.com/@fnurozdagl"}, {"ad": "Muhammet Furkan Sarı", "kanal": "https://www.youtube.com/@muhammetfurkansar9418"}, {"ad": "Enes Durukan", "kanal": "https://www.youtube.com/@EnesDurukan-r4p"}];
function yazarDegeri() {
  const v = $('yazarSec').value;
  if (v === '__yeni__') return { ad: $('yazarAd').value.trim(), kanal: $('yazarKanalYeni').value.trim(), yeni: true };
  if (v === '') return { ad: '', kanal: '', yeni: false };
  return { ad: HAVUZ[+v].ad, kanal: HAVUZ[+v].kanal, yeni: false };
}
$('yazarSec').addEventListener('change', () => {
  $('yeniYazarKutu').style.display = $('yazarSec').value === '__yeni__' ? 'block' : 'none';
  guncelleOnizleme();
});
function fotoIsle(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 400 / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.74).split(',')[1]);
    };
    img.onerror = () => rej(new Error('Fotoğraf okunamadı.'));
    img.src = URL.createObjectURL(file);
  });
}
async function icerikKoy(headers, repoPath, b64icerik, mesaj) {
  const url = `https://api.github.com/repos/${REPO}/contents/${repoPath}`;
  let sha = null;
  try {
    const g = await fetch(url + '?ref=' + BRANCH, { headers });
    if (g.status === 200) sha = (await g.json()).sha;
  } catch (e) {}
  const govde = { message: mesaj, content: b64icerik, branch: BRANCH };
  if (sha) govde.sha = sha;
  const r = await fetch(url, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(govde) });
  if (!r.ok) throw new Error(mesaj + ' başarısız (' + r.status + ')');
  return r.json();
}
async function egitmenHazirla(headers) {
  const y = yazarDegeri();
  if (!y.yeni || !y.ad) return;
  let foto = '';
  const f = $('yazarFoto').files[0];
  if (f) {
    const b64foto = await fotoIsle(f);
    foto = 'public/ekip/' + slugify(y.ad) + '.jpg';
    await icerikKoy(headers, foto, b64foto, `egitmen fotosu: ${y.ad}`);
  }
  const g = await fetch(`https://api.github.com/repos/${REPO}/contents/src/data/ekip.json?ref=` + BRANCH, { headers });
  if (!g.ok) return;
  const j = await g.json();
  const liste = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g, '')))));
  const norm = (a) => a.toLocaleLowerCase('tr-TR');
  if (!liste.some((e) => norm(e.ad) === norm(y.ad))) {
    liste.push({ ad: y.ad, foto: foto ? '/' + foto.replace(/^public\//, '') : '', desc: 'Ders hazırlayan gönüllü eğitmen.', links: y.kanal ? [{ type: 'Youtube', url: y.kanal }] : [] });
    await icerikKoy(headers, 'src/data/ekip.json', b64(JSON.stringify(liste, null, 1)), `ekip: ${y.ad}`);
  }
}
function dosyaIcerigi() {
  const yt = $('youtube').value.trim();
  const lines = ['---',
    `title: "${$('title').value.trim().replace(/"/g, '\\"')}"`,
    `description: "${($('description').value.trim() || $('title').value.trim()).replace(/"/g, '\\"')}"`,
    'sidebar:', `  order: ${$('order').value || 1}`,
    `youtube: "${yt}"`];
  const yz = yazarDegeri();
  if (yz.ad) lines.push(`yazar: "${yz.ad.replace(/"/g, '\\"')}"`);
  if (yz.kanal) lines.push(`yazarKanal: "${yz.kanal}"`);
  lines.push(`yazilim: "${$('yazilim').value}"`);
  if ($('tarih').value) lines.push(`tarih: ${$('tarih').value}`);
  lines.push('---', '', $('body').value.trim() || 'Bu ders yakında eklenecektir.', '');
  return lines.join('\n');
}
function guncelleOnizleme() { $('onizleme').textContent = `src/content/docs/${seciliKurs() || '...'}/${$('slug').value || '...'}.md\n\n` + dosyaIcerigi(); }
document.querySelectorAll('input,select,textarea').forEach((el) => el.addEventListener('input', guncelleOnizleme));
guncelleOnizleme();

function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
function sonucGoster(html) { const d = $('sonuc'); d.style.display = 'block'; d.innerHTML = html; }

$('kaydet').addEventListener('click', async () => {
  const token = $('token').value.trim();
  const slug = $('slug').value.trim();
  const yt = $('youtube').value.trim();
  if (!token) { $('tokenHata').textContent = 'Önce token gir.'; return; }
  $('tokenHata').textContent = '';
  if (!/^[a-z0-9-]+$/.test(slug)) { alert('Dosya adı sadece küçük harf, rakam ve tire olmalı.'); return; }
  const kursKlasor = seciliKurs();
  if (!/^[a-z0-9\-]+(\/[a-z0-9\-]+)+$/.test(kursKlasor)) { alert('Kurs klasörü “grup/klasor” biçiminde olmalı (örn. fem/yeni-kurs).'); return; }
  if (!/^[A-Za-z0-9_-]{11}$/.test(yt)) { $('ytHata').textContent = '11 karakterlik video ID gir (linkin tamamını değil).'; return; }
  $('ytHata').textContent = '';
  if (!$('title').value.trim()) { alert('Başlık boş olamaz.'); return; }
  if (!yazarDegeri().ad) { alert('Eğitmen seç veya yeni eğitmen adı yaz.'); return; }

  localStorage.setItem('am_token', token);
  const btn = $('kaydet'); btn.disabled = true; btn.textContent = 'Gönderiliyor...';
  const path = `src/content/docs/${kursKlasor}/${slug}.md`;
  const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
  const headers = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token };
  try {
    btn.textContent = 'Eğitmen hazırlanıyor...';
    await egitmenHazirla(headers);
    btn.textContent = 'Gönderiliyor...';
    // dosya var mı?
    let sha = null;
    const var_mi = await fetch(url + '?ref=' + BRANCH, { headers });
    if (var_mi.status === 200) {
      const j = await var_mi.json(); sha = j.sha;
      if (!confirm('Bu dosya zaten var. Üzerine yazılsın mı?')) { btn.disabled = false; btn.textContent = '💾 Kaydet ve Yayınla'; return; }
    }
    const govde = { message: `ders ekle: ${slug}`, content: b64(dosyaIcerigi()), branch: BRANCH };
    if (sha) govde.sha = sha;
    const r = await fetch(url, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(govde) });
    if (!r.ok) {
      const t = await r.text();
      throw new Error('GitHub hatası (' + r.status + '): ' + t.slice(0, 300));
    }
    const j = await r.json();
    sonucGoster(`✅ Yayınlandı!\nDosya: ${j.content.path}\nGitHub: <a href="${j.content.html_url}" target="_blank">dosyayı gör</a>\n\nSite 1-2 dakika içinde kendini günceller (Cloudflare otomatik derler). Hazırlayan adı Hakkımızda sayfasına otomatik eklenir.`);
  } catch (e) {
    sonucGoster('❌ Olmadı: ' + e.message + '\n\nToken yanlış olabilir ya da repo yetkisi (repo) eksiktir.');
  }
  btn.disabled = false; btn.textContent = '💾 Kaydet ve Yayınla';
});
</script>
</body>
</html>
